name: Build Naze Vault APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      # This repository ships the gradlew/gradlew.bat launcher scripts, but the
      # binary gradle-wrapper.jar cannot be produced in the environment that
      # generated this project (no network access to Gradle's distribution
      # service). We regenerate it here from the pinned version in
      # gradle/wrapper/gradle-wrapper.properties before the first ./gradlew
      # call. Once this workflow runs once against a real Gradle install, you
      # can commit the resulting gradle/wrapper/gradle-wrapper.jar so future
      # runs (and Android Studio) don't need this step.
      - name: Set up Gradle (and materialize the wrapper jar)
        uses: gradle/actions/setup-gradle@v4

      - name: Generate gradle-wrapper.jar if missing
        run: |
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            gradle wrapper --gradle-version 8.9
          fi

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Run lint
        run: ./gradlew lintDebug --stacktrace

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Locate APK
        run: |
          mkdir -p artifact-out
          find app/build/outputs/apk/debug -name "*.apk" -exec cp {} artifact-out/naze-vault-debug.apk \;

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: naze-vault-debug.apk
          path: artifact-out/naze-vault-debug.apk
          if-no-files-found: error
